version: "3.9"

services:
  etl:
    build: .
    container_name: etl_app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: etl_db
      DB_USER: etl_user
      DB_PASSWORD: etl_pass
    volumes:
      - .:/app
    command: ["uv", "run", "python", "main.py"]

  db:
    image: postgres:16
    container_name: etl_postgres
    restart: always
    environment:
      POSTGRES_DB: etl_db
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: